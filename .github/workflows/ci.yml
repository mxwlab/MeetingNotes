name: CI

# 托管 CI 只跑「不依赖模型/网络/GPU/GUI」的 hermetic 测试套件：
#   - Python 单元/契约测试（pytest，仅需 pytest + openai）
#   - Shell 契约/逻辑测试（tests/test_*.sh）
# 跑不了、也不在此跑的：真机 e2e（tests/e2e/，需 ~4G 模型 + MLX GPU）、原生 GUI、AirDrop。
# 那些请在本地/自托管手动跑，见 tests/e2e/test_first_run_offline.sh。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS Apple Silicon runner —— 依赖是 arm64-only 的 mlx；zsh 亦为默认可用。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test deps
        # hermetic 套件只需 pytest + openai（process.py 顶部 import openai；
        # mlx 系依赖在测试里被打桩/懒加载，无需安装）。
        run: |
          python -m pip install --upgrade pip
          pip install pytest openai

      - name: Python tests (pytest)
        run: pytest tests/ -v

      - name: Shell tests
        # 逐个跑 tests/test_*.sh（非递归，天然不含 tests/e2e/ 下的重型 e2e）。
        run: |
          set -e
          fail=0
          for t in tests/test_*.sh; do
            echo "== $t =="
            if zsh "$t"; then :; else echo "FAILED: $t"; fail=1; fi
          done
          exit $fail
